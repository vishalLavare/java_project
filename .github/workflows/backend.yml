name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          -t student-management-api .

      - name: Tag and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          REPO="${ECR_REPOSITORY:-student-management-api}"
          if [[ "$REPO" == *"."* ]]; then
            IMAGE_URI="$REPO:latest"
          else
            IMAGE_URI="$ECR_REGISTRY/$REPO:latest"
          fi
          echo "Tagging image as: $IMAGE_URI"
          docker tag student-management-api:latest "$IMAGE_URI"
          echo "Pushing image to ECR..."
          docker push "$IMAGE_URI"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY="${{ secrets.ECR_REGISTRY }}"
            REPO="${{ secrets.ECR_REPOSITORY }}"

            if [ -z "$REGISTRY" ]; then
              REGISTRY="<aws_account_id>.dkr.ecr.us-east-1.amazonaws.com"
            fi

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

            if [[ "$REPO" == *"."* ]]; then
              IMAGE_URI="$REPO:latest"
            elif [ -n "$REPO" ]; then
              IMAGE_URI="$REGISTRY/$REPO:latest"
            else
              IMAGE_URI="$REGISTRY/student-management-api:latest"
            fi

            echo "Pulling image: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            docker stop student-api || true
            docker rm student-api || true

            docker run -d \
              --name student-api \
              --restart always \
              -p 8080:8080 \
              "$IMAGE_URI"