name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          -t student-management-api .

      - name: Tag and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          RAW_REPO=$(echo "${ECR_REPOSITORY}" | sed -e 's|^https://||' -e 's|^http://||')
          if [ -z "$RAW_REPO" ]; then
            IMAGE_URI="$ECR_REGISTRY/my-repo:backend-latest"
          elif [[ "$RAW_REPO" == *"/"* ]]; then
            IMAGE_URI="$RAW_REPO:backend-latest"
          else
            IMAGE_URI="$ECR_REGISTRY/$RAW_REPO:backend-latest"
          fi
          echo "Tagging image as: $IMAGE_URI"
          docker tag student-management-api:latest "$IMAGE_URI"
          echo "Pushing image to ECR..."
          docker push "$IMAGE_URI"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:$HOME/.local/bin:$PATH"

            ECR_REGISTRY="411109262881.dkr.ecr.ap-south-1.amazonaws.com"
            IMAGE_URI="$ECR_REGISTRY/my-repo:backend-latest"

            # Wait for apt lock if another apt process is running
            wait_for_apt() {
              while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
                echo "Waiting for apt lock..."
                sleep 3
              done
            }

            # Auto-install Docker if missing
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              wait_for_apt
              sudo apt-get update -y && sudo apt-get install -y docker.io
              sudo usermod -aG docker ubuntu || true
            fi

            # Auto-install AWS CLI if missing
            if ! command -v aws &> /dev/null; then
              echo "AWS CLI not found. Installing AWS CLI..."
              wait_for_apt
              sudo apt-get update -y && sudo apt-get install -y awscli
            fi

            # Ensure docker daemon is running
            sudo systemctl start docker || true

            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 411109262881.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pulling image: $IMAGE_URI"
            sudo docker pull "$IMAGE_URI"

            # Ensure shared Docker network exists
            sudo docker network create student-network || true

            # Deploy MySQL container if not present
            if ! sudo docker ps -a --format '{{.Names}}' | grep -q "^mysql$"; then
              echo "Starting MySQL database container..."
              sudo docker run -d \
                --name mysql \
                --network student-network \
                --restart always \
                -e MYSQL_ROOT_PASSWORD=vishal \
                -e MYSQL_DATABASE=student_db \
                -p 3306:3306 \
                -v mysql_data:/var/lib/mysql \
                mysql:8.0
            else
              echo "Ensuring MySQL container is active on student-network..."
              sudo docker start mysql || true
              sudo docker network connect student-network mysql 2>/dev/null || true
            fi

            sudo docker stop student-api || true
            sudo docker rm student-api || true

            echo "Starting container student-api..."
            sudo docker run -d \
              --name student-api \
              --network student-network \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=mysql \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://mysql:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=vishal \
              "$IMAGE_URI"