name: Frontend Deploy ecr + ec2

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          --build-arg VITE_API_URL=${{ secrets.VITE_API_URL || '' }} \
          -t student-management-ui .

      - name: Tag and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          RAW_REPO=$(echo "${FRONTEND_ECR_REPOSITORY}" | sed -e 's|^https://||' -e 's|^http://||')
          if [ -z "$RAW_REPO" ]; then
            IMAGE_URI="$ECR_REGISTRY/myfrontend:frontend-latest"
          elif [[ "$RAW_REPO" == *"/"* ]]; then
            IMAGE_URI="$RAW_REPO:frontend-latest"
          else
            IMAGE_URI="$ECR_REGISTRY/$RAW_REPO:frontend-latest"
          fi
          echo "Tagging image as: $IMAGE_URI"
          docker tag student-management-ui:latest "$IMAGE_URI"
          echo "Pushing image to ECR..."
          docker push "$IMAGE_URI"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:$HOME/.local/bin:$PATH"

            ECR_REGISTRY="411109262881.dkr.ecr.ap-south-1.amazonaws.com"
            IMAGE_URI="$ECR_REGISTRY/myfrontend:frontend-latest"

            # Wait for apt lock if another apt process is running
            wait_for_apt() {
              while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
                echo "Waiting for apt lock..."
                sleep 3
              done
            }

            # Auto-install Docker if missing
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              wait_for_apt
              sudo apt-get update -y && sudo apt-get install -y docker.io
              sudo usermod -aG docker ubuntu || true
            fi

            # Auto-install AWS CLI if missing
            if ! command -v aws &> /dev/null; then
              echo "AWS CLI not found. Installing AWS CLI..."
              wait_for_apt
              sudo apt-get update -y && sudo apt-get install -y awscli
            fi

            # Ensure docker daemon is running
            sudo systemctl start docker || true

            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 411109262881.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pulling image: $IMAGE_URI"
            sudo docker pull "$IMAGE_URI"

            sudo docker stop student-ui || true
            sudo docker rm student-ui || true

            echo "Starting container student-ui..."
            sudo docker run -d \
              --name student-ui \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p 80:80 \
              "$IMAGE_URI"