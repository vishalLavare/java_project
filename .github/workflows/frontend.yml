name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          --build-arg VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:8080' }} \
          -t student-management-ui .

      - name: Tag and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          REPO="${FRONTEND_ECR_REPOSITORY:-myfrontend}"
          if [[ "$REPO" == *"."* ]]; then
            IMAGE_URI="$REPO:frontend-latest"
          else
            IMAGE_URI="$ECR_REGISTRY/$REPO:frontend-latest"
          fi
          echo "Tagging image as: $IMAGE_URI"
          docker tag student-management-ui:latest "$IMAGE_URI"
          echo "Pushing image to ECR..."
          docker push "$IMAGE_URI"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY="${{ secrets.ECR_REGISTRY }}"
            REPO="${{ secrets.FRONTEND_ECR_REPOSITORY }}"

            if [ -z "$REGISTRY" ]; then
              REGISTRY="411109262881.dkr.ecr.us-east-1.amazonaws.com"
            fi

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

            if [[ "$REPO" == *"."* ]]; then
              IMAGE_URI="$REPO:frontend-latest"
            elif [ -n "$REPO" ]; then
              IMAGE_URI="$REGISTRY/$REPO:frontend-latest"
            else
              IMAGE_URI="$REGISTRY/myfrontend:frontend-latest"
            fi

            echo "Pulling image: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            docker stop student-ui || true
            docker rm student-ui || true

            docker run -d \
              --name student-ui \
              --restart always \
              -p 80:80 \
              "$IMAGE_URI"