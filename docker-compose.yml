version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: student-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: vishal
      MYSQL_DATABASE: student_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvishal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot REST API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-backend-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: vishal
    depends_on:
      db:
        condition: service_healthy

  # React 19 + Vite Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: student-frontend-ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
