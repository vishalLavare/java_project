# Server Configuration
server.port=8080

# Application Name
spring.application.name=student-management-api

# Active Spring Profile (Set to 'mysql' to connect to MySQL Database)
spring.profiles.active=mysql

# =======================================================
# Default In-Memory H2 Database Configuration
# =======================================================
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom JSON formatting (Pretty print JSON responses)
spring.jackson.serialization.indent_output=true
